[project]
name = "nokinc-demo-payments"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115","uvicorn[standard]>=0.32","pydantic>=2.9","pyyaml>=6.0",
  "opentelemetry-api>=1.29","opentelemetry-sdk>=1.29",
  "opentelemetry-exporter-otlp-proto-http>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3","pytest-cov>=6.0","httpx>=0.28","mypy>=1.14","ruff>=0.8","types-PyYAML>=6.0",
       "diff-cover>=9.2","detect-secrets>=1.5","pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
