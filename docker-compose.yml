# Minimal observability for the demo. Two containers, no cluster.
#   Podman: podman compose up -d
#   Docker alternative: docker compose up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 uvicorn payments.main:app
#   open http://localhost:16686        <- the closing shot
services:
  jaeger:
    image: docker.io/jaegertracing/all-in-one:1.62.0
    environment: {COLLECTOR_OTLP_ENABLED: "true"}
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: payments
    ports: ["5432:5432"]
